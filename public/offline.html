<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>Offline | Revserp</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #050505; color: #f5f5f5; display: flex; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: #101010; border: 1px solid #292929; border-radius: 16px; box-shadow: 0 20px 50px #000; margin: auto; max-width: 440px; padding: 36px; text-align: center; width: 100%; }
      img { border-radius: 16px; height: 72px; width: 72px; }
      h1 { font-size: 1.5rem; margin: 24px 0 12px; }
      p { color: #b6b6b6; line-height: 1.55; margin: 0; }
      button { background: #f5f5f5; border: 0; border-radius: 8px; color: #050505; cursor: pointer; font: inherit; font-weight: 700; margin-top: 28px; padding: 12px 20px; }
      button:hover { background: #d9d9d9; }
      button:focus-visible { outline: 3px solid #72a7ff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/revserp-icon-192.png" alt="Revserp" />
      <h1>Revserp is offline</h1>
      <p>Dashboard data needs a connection. Check your network, then try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
